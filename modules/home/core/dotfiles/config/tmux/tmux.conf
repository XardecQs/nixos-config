# Estética y barra de estado
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g status-position top
set -g status-justify left
set -g status-style "bg=default"
set -g status-left-length 100
set -g status-interval 1
setw -g window-status-separator " "
setw -g window-status-format "#[fg=colour8,bg=default]#[bg=colour8,fg=default]#I:#W#[fg=colour8,bg=default]"
setw -g window-status-current-format "#[fg=cyan]#[bg=cyan,fg=black,bold]#I:#W#[bg=default,fg=cyan]"
set -g status-left "#[fg=green,bold] #S #[fg=colour8]│ "
set -g status-right "#[fg=colour7] %I:%M %p "
#set-window-option -g pane-border-status top
set-window-option -g pane-border-format "#[align=left]#[fg=cyan] Panel #P "
set -g pane-active-border-style fg=cyan
set -g pane-border-style fg=colour235
set -g message-style bg=default,fg=cyan
set -g mode-style "bg=colour238,fg=white"

# Atajos de teclado
set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind -n C-Tab next-window
bind -n C-S-Tab previous-window
#bind h split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
#bind v split-window -v -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
set -g mouse on
set -g renumber-windows on
set -g escape-time 2
set -g repeat-time 1000
set -g base-index 1
set -g pane-base-index 1
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"
bind q kill-pane
bind p display-popup -E "zsh"
bind -n S-Pageup copy-mode -u
bind r source-file ~/.config/tmux/tmux.conf \; display "¡Configuración recargada!"

bind m set status off
bind M set status on

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'b0o/tmux-autoreload'
set-option -g @tmux-autoreload-configs '~/.config/tmux/tmux.conf'
run '~/.config/tmux/plugins/tpm/tpm'